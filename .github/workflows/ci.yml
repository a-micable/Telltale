name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install g++
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Build
        run: make

      - name: Run tests
        run: |
          set -o pipefail
          make test 2>&1 | tee test-output.txt
          if grep -q FAILED test-output.txt; then
            echo "Test suite reported FAILED"
            exit 1
          fi
          grep -q "276/276 passed" test-output.txt
