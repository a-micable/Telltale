[project]
name = "telltale"
version = "0.2.0"
description = "C++17 binary event-log CLI — Python tooling only for CI/tests"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "clang-format==23.1.0",
  "gcovr==8.6",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
